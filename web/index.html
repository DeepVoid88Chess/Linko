<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Linko</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#111;background:#f5f5f7}
    body{margin:0;min-height:100vh;display:grid;place-items:center}
    main{width:min(92vw,900px);padding:28px}
    .card{background:white;border-radius:24px;padding:28px;box-shadow:0 10px 35px #0001}
    h1{font-size:42px;margin:0 0 4px}.muted{color:#666}
    input,button{font:inherit;border-radius:12px;padding:12px 14px;border:1px solid #ddd}
    button{cursor:pointer;background:#111;color:white;border:0}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    #screen{width:100%;margin-top:20px;background:#111;border-radius:16px;display:none;touch-action:none}
    #status{margin-top:14px}.code{font-size:32px;font-weight:700;letter-spacing:5px}
  </style>
</head>
<body><main><div class="card">
  <h1>Linko</h1><div class="muted">Your computer. Wherever you are.</div>
  <div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="Pairing code"><button id="connect">Connect</button></div>
  <div id="status" class="muted">Enter the 6-digit code shown by Linko.exe.</div>
  <canvas id="screen"></canvas>
</div></main>
<script>
const codeEl=document.querySelector('#code'), statusEl=document.querySelector('#status'), canvas=document.querySelector('#screen'), ctx=canvas.getContext('2d');
let ws;
function send(data){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(data));}
function connect(){
  const code=codeEl.value.trim(); if(!/^\d{6}$/.test(code)){statusEl.textContent='Enter a valid 6-digit pairing code.';return;}
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws?code=${code}`); ws.binaryType='blob';
  ws.onopen=()=>statusEl.textContent='Connected. Waiting for your computer screen…';
  ws.onclose=()=>statusEl.textContent='Disconnected.';
  ws.onerror=()=>statusEl.textContent='Connection failed.';
  ws.onmessage=async e=>{
    if(typeof e.data==='string'){try{const m=JSON.parse(e.data);if(m.type==='hello')statusEl.textContent='Computer connected.'; }catch{}}
    else {const img=new Image();img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.drawImage(img,0,0);canvas.style.display='block';URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(e.data)}
  };
}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();send({type:'mouse',action:'down',button:'left',x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height})});
canvas.addEventListener('pointerup',e=>{const r=canvas.getBoundingClientRect();send({type:'mouse',action:'up',button:'left',x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height})});
canvas.addEventListener('pointermove',e=>{if(e.buttons){const r=canvas.getBoundingClientRect();send({type:'mouse',action:'move',x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height})}});
document.querySelector('#connect').onclick=connect;
</script></body></html>
